# Local LendLoop automation stack. Run through `pnpm stack:up` / `pnpm stack:down`,
# which pass `--env-file n8n/.env` (generated by `pnpm setup:local`).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: n8n
      POSTGRES_DB: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run pnpm setup:local}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.33.0
    environment:
      MP_ENABLE_CHAOS: "true" # lets the E2E make SMTP fail on demand (local only)
    ports: ["${MAILPIT_UI_PORT:-8025}:8025"]
  # Local stand-in for Resend's email API: n8n sends the same request as in
  # production, and this relays it to Mailpit over SMTP. Not exposed on the host.
  mail-api:
    image: node:24.15.0-alpine
    user: node
    command: ["node", "/app/local-mail-api.ts"]
    volumes: ["./n8n/local-mail-api.ts:/app/local-mail-api.ts:ro"]
    environment:
      MAIL_API_KEY: ${MAIL_API_KEY:?run pnpm setup:local}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on: [mailpit]
  n8n:
    build: ./n8n
    env_file: [./n8n/.env]
    # Hardening defaults (env access blocked, execution data pruning, public API
    # off, ...) are baked into n8n/Dockerfile. Only local-only values go here.
    environment:
      N8N_OWNER_PASSWORD: "" # only the bcrypt hash enters the container
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_SECURE_COOKIE: "false" # local http only; the image defaults to true
    ports: ["5678:5678"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: { condition: service_healthy }
      mail-api: { condition: service_started }
volumes:
  postgres-data:
