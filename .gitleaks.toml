# gitleaks configuration: the default rules, plus allowlists for test fixtures
# only. Each entry needs BOTH a listed path and the exact fixture value
# (condition = "AND"), so a real secret in those files is still reported.
# Run locally over the full history:
#   docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest git /repo --redact

[extend]
useDefault = true

[[allowlists]]
description = "Shared HMAC test vectors: a published test-only secret (contract tests on both sides)."
condition = "AND"
paths = ['''^contracts/hmac-vectors\.json$''', '''^docs/superpowers/plans/2026-10-31-lendloop-2a-automation-convex\.md$''']
regexes = ['''^lendloop\-test\-secret\-0123456789abcdef0123456789$''']

[[allowlists]]
description = "convex/http.test.ts inbound-signature test secret (and the plan that introduced it)."
condition = "AND"
paths = ['''^convex/http\.test\.ts$''', '''^docs/superpowers/plans/2026-10-31-lendloop-2a-automation-convex\.md$''']
regexes = ['''^convex\-inbound\-secret\-0123456789abcdef$''']

[[allowlists]]
description = "Fake Svix whsec_ signing secret of the Clerk webhook tests (and the plan that introduced it)."
condition = "AND"
paths = ['''^convex/clerkWebhook\.test\.ts$''', '''^docs/superpowers/plans/2026-10-31-lendloop-2a-automation-convex\.md$''']
regexes = ['''^whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw$''']

[[allowlists]]
description = "Rotation test secret in the n8n workflow contract tests."
condition = "AND"
paths = ['''^tests/n8n/contract\.test\.ts$''']
regexes = ['''^rotated\-secret\-0123456789abcdef0123456789abcdef$''']
